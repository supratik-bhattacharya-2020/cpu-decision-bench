[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "decisionbench"
version = "0.1.0"
description = "CPU benchmarks for small typed decision models"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = [
  "numpy==2.2.6",
  "psutil==7.1.0",
  "pyarrow==21.0.0",
  "transformers==5.17.0",
  "huggingface-hub==1.31.0",
]

[project.optional-dependencies]
cpu = ["llama-cpp-python==0.3.35"]
test = ["pytest==8.4.2"]

[project.scripts]
decisionbench = "decisionbench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
